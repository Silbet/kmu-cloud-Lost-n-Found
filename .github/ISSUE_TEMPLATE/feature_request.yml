name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안할 때 사용하는 이슈 템플릿입니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 어떤 불편함이나 문제가 있어서 기능이 필요한지 작성해주세요.
      placeholder: 예) 현재는 사용자가 원하는 조건으로 목록을 빠르게 찾기 어려움
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
      description: 어떤 기능이나 개선이 있으면 좋을지 작성해주세요.
      placeholder: 예) 분실물 목록에서 카테고리, 장소, 날짜 기준으로 필터링할 수 있으면 좋겠음
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: 기대 효과
      description: 이 기능이 추가되면 어떤 점이 좋아지는지 작성해주세요.
      placeholder: 예) 사용자가 원하는 분실물을 더 빠르게 찾을 수 있음
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 이미 생각해본 다른 방법이나 임시 해결 방법이 있다면 작성해주세요.
      placeholder: 예) 검색어 입력만으로 찾는 방법도 있지만, 조건이 많아질수록 필터가 더 편할 것 같음
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 화면 예시, 이미지, 관련 링크가 있다면 첨부해주세요.
      placeholder: 이 영역에 이미지나 링크를 추가해주세요.
    validations:
      required: false
