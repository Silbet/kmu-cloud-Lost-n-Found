name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안할 때 사용하는 이슈 템플릿입니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: content
    attributes:
      label: 내용
      description: 해결하고 싶은 문제, 제안하는 기능, 기대 효과, 참고 자료 등을 자유롭게 작성해주세요.
      value: |
        ### 해결하고 싶은 문제
        (예: 현재 어떤 불편함이나 문제가 있는지 작성해주세요.)

        ### 제안하는 기능
        (예: 어떤 기능이나 개선이 있으면 좋을지 작성해주세요.)

        ### 기대 효과
        (예: 이 기능이 추가되면 어떤 점이 좋아지는지 작성해주세요.)

        ### 참고 자료
        (예: 화면 예시, 이미지, 관련 링크가 있다면 첨부해주세요.)
    validations:
      required: true
