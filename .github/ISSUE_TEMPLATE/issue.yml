name: 이슈 작성
description: 버그 제보나 기능 제안을 작성할 때 사용하는 통합 이슈 템플릿입니다.
title: "[Issue] "
body:
  - type: dropdown
    id: issue-type
    attributes:
      label: 이슈 종류
      description: 작성하려는 이슈 종류를 선택해주세요.
      options:
        - 버그
        - 기능 제안
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 이슈 내용을 한두 문장으로 간단히 작성해주세요.
      placeholder: 예) 승인 버튼 클릭 시 상태가 변경되지 않음 / 목록 필터 기능이 필요함
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 상세 내용
      description: 버그라면 발생 상황을, 기능 제안이라면 필요한 이유와 제안 내용을 작성해주세요.
      placeholder: |
        예) 버그
        - 보관소 관리자로 로그인
        - 확인요청 승인 버튼 클릭
        - 우측 상단에 오류가 뜨고 상태가 변경되지 않음

        예) 기능 제안
        - 현재는 원하는 조건으로 목록을 빠르게 찾기 어려움
        - 카테고리, 장소, 날짜 기준 필터가 있으면 좋겠음
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: 기대 결과
      description: 정상 동작 또는 기능 추가 후 기대하는 결과를 작성해주세요.
      placeholder: 예) 상태가 정상적으로 변경됨 / 원하는 분실물을 더 빠르게 찾을 수 있음
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: 실제 결과
      description: 버그인 경우 실제로 발생한 결과를 작성해주세요. 기능 제안이면 비워두어도 됩니다.
      placeholder: 예) 상태가 변경되지 않고 오류 메시지가 표시됨
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 오류 화면, 참고 이미지, 관련 링크가 있다면 첨부해주세요.
      placeholder: 이 영역에 이미지나 링크를 추가해주세요.
    validations:
      required: false
