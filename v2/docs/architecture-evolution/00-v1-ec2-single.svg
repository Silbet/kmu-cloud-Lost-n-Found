<path d="M 185 345.0 L 300 380.0" class="edge" marker-end="url(#arrow)"/><text x="242.5" y="353.5" text-anchor="middle" class="edge-label">웹/API/이미지 요청</text>
<rect x="55" y="310" width="130" height="70" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
