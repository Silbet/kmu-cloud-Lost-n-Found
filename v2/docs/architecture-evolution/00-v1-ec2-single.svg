<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <style>
    .title { font: 700 29px Arial, sans-serif; fill:#111827; }
    .subtitle { font: 400 15px Arial, sans-serif; fill:#475569; }
