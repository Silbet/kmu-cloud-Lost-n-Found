    .node-label.small { font-size: 13px; font-weight: 600; fill:#334155; }
    .edge { fill:none; stroke:#475569; stroke-width:2.2; }
    .edge-label { font: 600 12px Arial, sans-serif; fill:#334155; paint-order:stroke; stroke:#ffffff; stroke-width:5px; stroke-linejoin:round; }
    .note { font: 500 14px Arial, sans-serif; fill:#334155; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="55" y="50" class="title">0. V1: EC2 단일 서버</text>
<text x="55" y="78" class="subtitle">최소 인프라로 빠르게 배포. 대신 프론트, 백엔드, DB, 이미지가 한 서버에 묶임.</text>
<rect x="40" y="100" width="1165" height="260" rx="18" fill="#FAFAFA" stroke="#E5E7EB"/>
<rect x="40" y="390" width="1165" height="330" rx="18" fill="#FAFAFA" stroke="#E5E7EB"/>
<text x="60" y="128" class="note">정적 파일 / 이미지 제공 영역</text>
