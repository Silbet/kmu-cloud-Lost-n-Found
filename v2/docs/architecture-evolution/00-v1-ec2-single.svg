<text x="136.0" y="350.0" text-anchor="middle" class="node-label">사용자</text>
<rect x="300" y="325" width="245" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<circle cx="326" cy="351" r="13" fill="#3B82F6" opacity="0.9"/>
<text x="438.5" y="376.0" text-anchor="middle" class="node-label">EC2 단일 서버</text>
<text x="438.5" y="398.0" text-anchor="middle" class="node-label small">프론트+백엔드+DB+이미지</text>
<rect x="55" y="705" width="650" height="40" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
