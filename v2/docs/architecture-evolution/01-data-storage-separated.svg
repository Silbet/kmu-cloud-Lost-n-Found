<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <style>
    .title { font: 700 29px Arial, sans-serif; fill:#111827; }
    .subtitle { font: 400 15px Arial, sans-serif; fill:#475569; }
    .node-label { font: 700 15px Arial, sans-serif; fill:#111827; }
    .node-label.small { font-size: 13px; font-weight: 600; fill:#334155; }
    .edge { fill:none; stroke:#475569; stroke-width:2.2; }
    .edge-label { font: 600 12px Arial, sans-serif; fill:#334155; paint-order:stroke; stroke:#ffffff; stroke-width:5px; stroke-linejoin:round; }
    .note { font: 500 14px Arial, sans-serif; fill:#334155; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="55" y="50" class="title">1. 데이터 저장 책임 분리</text>
<text x="55" y="78" class="subtitle">사라지면 안 되는 DB와 이미지를 EC2 밖의 관리형/전용 저장소로 먼저 분리.</text>
<rect x="40" y="100" width="1165" height="260" rx="18" fill="#FAFAFA" stroke="#E5E7EB"/>
<rect x="40" y="390" width="1165" height="330" rx="18" fill="#FAFAFA" stroke="#E5E7EB"/>
<text x="60" y="128" class="note">정적 파일 / 이미지 제공 영역</text>
<text x="60" y="418" class="note">API / 데이터 / 비동기 처리 영역</text>

