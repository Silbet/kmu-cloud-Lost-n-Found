<path d="M 422.5 325 L 422 265 L 640.0 317" class="edge" marker-end="url(#arrow)"/><text x="422" y="256" text-anchor="middle" class="edge-label">이미지 저장</text>
<rect x="55" y="310" width="130" height="70" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
<circle cx="81" cy="336" r="13" fill="#64748B" opacity="0.9"/>
